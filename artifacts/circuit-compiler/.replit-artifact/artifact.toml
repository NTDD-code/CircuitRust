kind = "web"
previewPath = "/"
title = "Strict Circuit Compiler"
version = "1.0.0"
id = "artifacts/circuit-compiler"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22240

[services.development]
run = "pnpm --filter @workspace/circuit-compiler run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/circuit-compiler", "run", "build" ]
publicDir = "artifacts/circuit-compiler/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22240"
BASE_PATH = "/"
